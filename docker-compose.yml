services:
  postgres:
    image: postgres:17
    container_name: sumateramall-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sumateramall}
      POSTGRES_USER: ${DB_USERNAME:-sumateramall}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD harus diatur di file .env}
    ports:
      - "5433:5432"
    volumes:
      - sumateramall_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sumateramall} -d ${DB_DATABASE:-sumateramall}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sumateramall_pgdata:
    name: sumateramall_pgdata
